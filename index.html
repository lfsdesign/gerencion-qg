<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comunicado do Dia</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Inter', sans-serif;
    background-color: #060e1e;
    color: #f0f6ff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .container {
    width: 100%;
    max-width: 900px;
    background: #0a1628;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  }

  .grid-container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }

  .card {
    background-color: #0f1f35;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: transform 0.2s ease, border-color 0.2s ease;
  }

  .card:hover {
    transform: translateY(-2px);
    border-color: #f59e0b;
  }

  .code {
    font-size: 11px;
    font-weight: 700;
    color: #f59e0b;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  .name {
    font-size: 15px;
    font-weight: 700;
    color: #f0f6ff;
    margin-bottom: 12px;
    line-height: 1.3;
  }

  .meta-box {
    background: rgba(245, 158, 11, 0.1);
    border: 1px solid rgba(245, 158, 11, 0.25);
    border-radius: 8px;
    padding: 10px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .meta-label {
    font-size: 10px;
    font-weight: 600;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .meta-value {
    font-size: 14px;
    font-weight: 800;
    color: #10b981;
  }
</style>
</head>
<body>

<div class="container">
  <div class="grid-container">

    <!-- Card 1 -->
    <div class="card">
      <div>
        <div class="code">RCA 017</div>
        <div class="name">EDIMAR BARBOSA</div>
      </div>
      <div class="meta-box">
        <span class="meta-label">Meta</span>
        <span class="meta-value">R$ 8.500,00</span>
      </div>
    </div>

    <!-- Card 2 -->
    <div class="card">
      <div>
        <div class="code">RCA 025</div>
        <div class="name">ADSON BRUNO</div>
      </div>
      <div class="meta-box">
        <span class="meta-label">Meta</span>
        <span class="meta-value">R$ 10.000,00</span>
      </div>
    </div>

    <!-- Card 3 -->
    <div class="card">
      <div>
        <div class="code">RCA 042</div>
        <div class="name">CARLOS SILVA</div>
      </div>
      <div class="meta-box">
        <span class="meta-label">Meta</span>
        <span class="meta-value">R$ 7.200,00</span>
      </div>
    </div>

    <!-- Card 4 -->
    <div class="card">
      <div>
        <div class="code">RCA 108</div>
        <div class="name">MARCOS OLIVEIRA</div>
      </div>
      <div class="meta-box">
        <span class="meta-label">Meta</span>
        <span class="meta-value">R$ 9.000,00</span>
      </div>
    </div>

  </div>
</div>

</body>
</html>
